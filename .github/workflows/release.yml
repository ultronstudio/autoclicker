name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyautogui pynput pyinstaller

      - name: Build one-file executable
        env:
          NANOCLICKER_VERSION: ${{ github.ref_name }}
        run: |
          pyinstaller --onefile --windowed --name NanoAutoClicker --icon .\icon.ico --add-data ".\lang;lang" --clean .\main.py

      - name: Sign executable
        if: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          .\scripts\sign-release.ps1 -FilePath .\dist\NanoAutoClicker.exe -CertificateBase64 $env:WINDOWS_CERT_PFX_BASE64 -CertificatePassword $env:WINDOWS_CERT_PASSWORD

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist\NanoAutoClicker.exe
          draft: false
          prerelease: false
